<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a12">
  <title>Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #060810;
      --panel: rgba(15, 19, 31, .78);
      --panel-2: rgba(21, 26, 42, .72);
      --border: rgba(255,255,255,.09);
      --text: #f4f7ff;
      --muted: #8d96ab;
      --accent: #7c5cff;
      --accent-2: #36c8ff;
      --green: #39e58c;
      --danger: #ff5577;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(124,92,255,.18), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(54,200,255,.12), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(124,92,255,.10), transparent 35%),
        var(--bg);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1500px, 100%);
      height: 100vh;
      margin: auto;
      padding: 18px;
      display: flex;
    }

    .shell {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: rgba(8,11,19,.76);
      backdrop-filter: blur(30px);
      box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    /* SIDEBAR */

    .sidebar {
      width: 310px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: rgba(11,14,24,.75);
      display: flex;
      flex-direction: column;
    }

    .brand {
      height: 82px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 21px;
      background:
        linear-gradient(135deg, rgba(124,92,255,.95), rgba(54,200,255,.9));
      box-shadow: 0 8px 30px rgba(124,92,255,.25);
    }

    .brand-name {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -.3px;
    }

    .brand-status {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .search-wrap {
      padding: 16px;
    }

    .search {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.035);
    }

    .search span {
      color: var(--muted);
      font-size: 18px;
    }

    .search input {
      width: 100%;
      outline: none;
      border: none;
      color: var(--text);
      background: transparent;
      font-size: 13px;
    }

    .search input::placeholder {
      color: #687187;
    }

    .nav {
      padding: 0 10px;
    }

    .nav-button {
      width: 100%;
      height: 46px;
      margin-bottom: 5px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      background: transparent;
      border-radius: 12px;
      text-align: left;
      transition: .2s;
    }

    .nav-button:hover {
      color: var(--text);
      background: rgba(255,255,255,.05);
    }

    .nav-button.active {
      color: white;
      background: linear-gradient(90deg, rgba(124,92,255,.22), rgba(124,92,255,.07));
      border: 1px solid rgba(124,92,255,.15);
    }

    .nav-icon {
      width: 27px;
      text-align: center;
      font-size: 17px;
    }

    .profile-mini {
      margin-top: auto;
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: white;
      font-weight: 800;
      background: linear-gradient(135deg, #7c5cff, #36c8ff);
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 700;
    }

    .profile-handle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .settings-button {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      transition: .2s;
    }

    .settings-button:hover {
      color: white;
      background: rgba(255,255,255,.06);
    }

    /* MAIN */

    .main {
      min-width: 0;
      flex: 1;
      position: relative;
    }

    .view {
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .view.active {
      display: flex;
    }

    .topbar {
      height: 82px;
      flex-shrink: 0;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .page-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .page-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .top-action {
      height: 40px;
      padding: 0 15px;
      color: white;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #6043d9);
      box-shadow: 0 8px 25px rgba(124,92,255,.2);
    }

    /* WELCOME */

    .welcome {
      height: 100%;
      padding: 35px;
      overflow: auto;
    }

    .hero {
      min-height: 280px;
      padding: 38px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        radial-gradient(circle at 80% 20%, rgba(54,200,255,.13), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(124,92,255,.16), transparent 35%),
        rgba(255,255,255,.025);
    }

    .hero::after {
      content: "✦";
      position: absolute;
      right: 55px;
      top: 35px;
      font-size: 100px;
      color: rgba(255,255,255,.035);
    }

    .hero-label {
      color: #9e91ff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hero h1 {
      max-width: 600px;
      margin-top: 14px;
      font-size: clamp(30px, 4vw, 49px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .hero p {
      max-width: 570px;
      margin-top: 17px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .cards {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      min-height: 145px;
      padding: 21px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,.025);
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(124,92,255,.25);
      background: rgba(255,255,255,.04);
    }

    .card-icon {
      font-size: 23px;
    }

    .card h3 {
      margin-top: 15px;
      font-size: 14px;
    }

    .card p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* FRIENDS */

    .content {
      padding: 28px;
      overflow: auto;
    }

    .friend-code {
      margin-bottom: 22px;
      padding: 22px;
      border: 1px solid rgba(124,92,255,.18);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(124,92,255,.10), rgba(54,200,255,.04));
    }

    .code-label {
      color: var(--muted);
      font-size: 12px;
    }

    .code-row {
      margin-top: 9px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .code {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .copy-btn {
      padding: 8px 11px;
      color: #c8c1ff;
      border-radius: 9px;
      background: rgba(124,92,255,.12);
      font-size: 12px;
    }

    .add-box {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,.025);
    }

    .add-box h3 {
      font-size: 15px;
    }

    .add-box p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .add-form {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .text-input {
      min-width: 0;
      flex: 1;
      height: 45px;
      padding: 0 14px;
      outline: none;
      color: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(0,0,0,.2);
    }

    .text-input:focus {
      border-color: rgba(124,92,255,.55);
    }

    .primary {
      height: 45px;
      padding: 0 17px;
      color: white;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #6043d9);
    }

    .empty-friends {
      margin-top: 25px;
      padding: 45px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    .empty-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    /* SETTINGS */

    .settings-list {
      max-width: 700px;
    }

    .setting {
      padding: 18px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255,255,255,.025);
    }

    .setting-title {
      font-size: 13px;
      font-weight: 700;
    }

    .setting-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .badge {
      padding: 6px 9px;
      border-radius: 8px;
      color: #9cf0c5;
      background: rgba(57,229,140,.08);
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .app {
        padding: 0;
        min-height: 100vh;
        height: auto;
      }

      .shell {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .sidebar {
        width: 76px;
      }

      .brand {
        justify-content: center;
        padding: 14px;
      }

      .brand > div:not(.logo) {
        display: none;
      }

      .search-wrap {
        padding: 10px;
      }

      .search {
        justify-content: center;
        padding: 0;
      }

      .search input {
        display: none;
      }

      .nav-button {
        justify-content: center;
        padding: 0;
      }

      .nav-button span:not(.nav-icon) {
        display: none;
      }

      .profile-mini {
        justify-content: center;
        padding: 10px;
      }

      .profile-info,
      .settings-button {
        display: none;
      }

      .topbar {
        padding: 0 18px;
      }

      .welcome,
      .content {
        padding: 18px;
      }

      .hero {
        padding: 25px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .sidebar {
        width: 64px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .add-form {
        flex-direction: column;
      }

      .primary {
        width: 100%;
      }

      .code {
        font-size: 20px;
      }
    }

    /* TOAST */

    .toast {
      position: fixed;
      right: 25px;
      bottom: 25px;
      max-width: 300px;
      padding: 13px 16px;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(17,21,34,.95);
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
      transition: .25s;
      font-size: 13px;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
